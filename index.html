<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的个人主页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 50px 40px;
            max-width: 700px;
            width: 100%;
        }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 36px;
            font-weight: bold;
        }
        h1 {
            text-align: center;
            color: #2d3748;
            font-size: 28px;
            margin-bottom: 8px;
        }
        .subtitle {
            text-align: center;
            color: #718096;
            font-size: 15px;
            margin-bottom: 30px;
        }
        .section {
            margin-bottom: 25px;
        }
        .section-title {
            font-size: 16px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 2px solid #e2e8f0;
        }
        .item {
            padding: 10px 0;
            color: #4a5568;
            font-size: 15px;
            line-height: 1.6;
        }
        .tag {
            display: inline-block;
            background: #edf2f7;
            color: #4a5568;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 13px;
            margin-right: 6px;
            margin-top: 4px;
        }
        .links {
            text-align: center;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e2e8f0;
        }
        .links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
            font-size: 14px;
        }
        .links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="avatar">
            Y
        </div>
        <h1>
            你好，我是 Yukin0as
        </h1>
        <p class="subtitle">
            信息与计算科学 · Python 数据分析 · 机器学习
        <br>yukionoshita040912@gmail.com
        </p>
        <div class="section">
            <div class="section-title">
                📁 项目经历
            </div>
            <div class="item">
                🏠 房价预测系统 — 线性回归 & 随机森林，MAE/MSE/R² 评估，热力图可视化
            </div>
            <div class="item">
                🛒 电商用户行为分析 — Pandas 数据清洗，复购率 / 热销品分析
            </div>
            <div class="item">
                🌐 Flask Web 展示 — 内网穿透公网访问，项目演示页面
            </div>
        </div>

        <div class="section">
            <div class="section-title">
                🛠️ 技术栈
            </div>
            <div>
                <span class="tag">
                    Python
                </span>
                <span class="tag">
                    Pandas
                </span>
                <span class="tag">
                    Matplotlib
                </span>
                <span class="tag">
                    Scikit-learn
                </span>
                <span class="tag">
                    Flask
                </span>
                <span class="tag">
                    Git/GitHub
                </span>
            </div>
        </div>

        <div class="links">
            <a href="https://github.com/yukin0as" target="_blank">
                GitHub
            </a>
        </div>
    </div>
</body>
</html>
