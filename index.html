<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>亦未雨的个人主页</title>
<style>
*{
  margin:0;
  padding:0;
}
html,body{
  width:100%;
  height:100%;
  overflow:hidden;
}
#videoBg {
  position:fixed;
  top:0;
  left:0;
  object-fit: cover;
  object-position: 70% center;
  z-index:-2;
}

body{
  overflow:hidden;
  color:#fff;
  /* 背景图 */
  background-image: url("image/dd01.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}
#starCanvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

.content{
  position:relative;
  z-index:1;
  padding:30px;
    margin-left:110px;
    margin-top:5px;
}
.content h1{
  text-shadow: 0 0 8px #fff,0 0 16px #8cf;
}
.content p{
  text-shadow: 0 0 6px #aef;
  margin-top:8px;
}
.bg-video{
  position:fixed;
  top:0;
  left:0;
  width:100vw;
  height:100vh;
  object-fit:cover;
  z-index:-2;
}

.avatar-wrap{
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 5;
  position: relative; /* 作为下拉菜单的父容器 */
}

.avatar{
  width: 150px;
  height: 150px;
  border-radius: 50%;
  border: 2px solid rgba(170,220,255,0.6);
  box-shadow: 0 0 12px #8cf;
  cursor: pointer;
  transition: 0.2s;
  display: block;
}
.avatar:hover{
  box-shadow: 0 0 20px #8cf;
}

.dropdown-menu{
  position: absolute; /*  绝对定位，跟着父容器走 */
  top: 100%;        /*  紧贴父元素底部，也就是头像的下面 */
  left: 0;
  margin-top: 10px;
  display: none;
  flex-direction: column;
  gap: 8px;
  background: rgba(0, 20, 40, 0.1);
  backdrop-filter: blur(6px);/*毛玻璃效果*/
  padding: 12px;
  border-radius: 10px;
  min-width: 160px;
}

.dropdown-menu a{
  color: #fff;
  text-decoration: none;
  padding: 8px 12px;
  border-radius: 6px;
  text-shadow: 0 0 6px #8cf;
  transition: 0.2s;
  font-size:25px;
}
.dropdown-menu a:hover{
  background: rgba(40, 120, 200, 0.55);
  box-shadow: 0 0 10px #6bf;
}
.dropdown-menu.show{
  display: flex;
}
/* 网页中间顶部标题 */
.page-top-title{
  position: fixed;
  top: 40px;
  left: min(50%);
  transform: translateX(-50%);
  z-index: 2;
  color: #fff;
  font-size: 45px;
  letter-spacing: 2px;
  text-shadow: 0 0 8px #8cf, 0 0 16px #6bf;

  white-space: nowrap;
}
/* 窗口小于 1000px 的时候，文字不再居中，跑到头像右边 */
@media (max-width: 1000px) {
  .page-top-title{
    left: 180px;
    transform: translateX(0);
  }
}
@media (max-width:760px){
  body{
    background-size: auto 100%;
    background-position: left center;
  }
}
/* 手机端：视频强制铺满屏幕，不能漏背景 */

@media (max-width: 760px) {
  #videoBg,
  .video-wrap {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    width: 100vw !important;
    height: 100vh !important;
    object-fit: cover !important;
    z-index: -2 !important;
  }

  /* 背景图只做兜底，手机端被视频压住就够了 */
  body {
    background-size: cover;
    background-position: center;
  }
}

</style>
</head>
<body>
<video id="videoBg" autoplay muted loop playsinline poster="image/dd01.png">
  <source src="image/dd01.mp4" type="video/mp4">
</video>
<!-- 头像+下拉菜单容器 -->
<div class="avatar-wrap">
  <img class="avatar" src="image/yukino01.jpg"  id="avatarBtn">
  <div class="dropdown-menu" id="dropMenu">
    <a href="#home">🏠 首页</a>
    <a href="#about">👤 关于我</a>
    <a href="#works">📁 作品</a>
    <a href="#contact">✉️ 联系</a>
  </div>
</div>
<div class="page-top-title">
  闪烁星辰之下，你我皆是过客
</div>

<canvas id="starCanvas"></canvas>






<script src="star.js">

</script>
</body>
</html>
